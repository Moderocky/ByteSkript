name: Run Tests
on:
  push:
    paths-ignore:
      - '**.md'
      - '**.yml'
jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Run tests with Maven
        run: mvn -B test --file pom.xml
